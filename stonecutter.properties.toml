# Central Stonecutter properties. Top-level keys apply to every node;
# [<loader>."<version>"] sections apply to that node only (resolved after
# properties.tags(version, loader) in each build script).
# Dependency versions mirror leclowndu93150's Cushion-Backport build.gradle.kts.

mod_name = "Optimized Cushions Backport"
mod_id = "optimizedcushionsbackport"
mod_version = "0.1.0"

# The mod this addon optimises.
cushionbackport_mod_id = "cushionbackport"

