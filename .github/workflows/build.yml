# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build test
      - name: run GameTests (server, fabric)
        run: ./gradlew :26.3-fabric:runGameTest --info
      - name: run GameTests (client, fabric)
        run: ./gradlew :26.3-fabric:runProductionClientGameTest
      - name: upload client GameTest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-logs
          path: |
            versions/26.3-fabric/run/logs/
            versions/26.3-fabric/run/crash-reports/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: versions/*/build/libs/
