# pre-releases. Do not bump without verifying Loom 1.17-SNAPSHOT + Java 25 + Fabric API 0.158.3.
# check these on https://fabricmc.net/develop
minecraft_version=26.3-snapshot-10
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.1.0
maven_group=xyz.nikitacartes

# Dependencies
fabric_api_version=0.158.3+26.3
