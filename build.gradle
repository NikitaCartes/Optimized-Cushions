plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "optimizedcushions" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "optimizedcushions-test"
        eula = true
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

tasks.register("collectJars") {
    group = "build"
    dependsOn("build")
    doLast {
        def libsDir = layout.buildDirectory.dir("libs").get().asFile
        if (!libsDir.isDirectory()) {
            throw new GradleException("Expected libs dir not found: ${libsDir}")
        }
        def jars = libsDir.listFiles()?.findAll { it.name.endsWith(".jar") }?.collect { it.name } ?: []
        logger.lifecycle("collectJars: ${jars.size()} jar(s) in ${libsDir}: ${jars}")
    }
}

tasks.register("cleanCollectedJars", Delete) {
    group = "build"
    delete(layout.buildDirectory.dir("libs"))
}
