plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "LlamaLad7"
        url = uri("https://maven.llamalad7.com/releases")
    }
    maven {
        name = "LlamaLad7Snapshots"
        url = uri("https://maven.llamalad7.com/snapshots")
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "optimizedcushions" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "optimizedcushions-test"
        eula = true
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Explicit MixinExtras for WrapOperation/@Local (OC-27). Fabric API currently re-exports it,
    // but that is not a guaranteed API; pin the version we compile against (io.github.llamalad7).
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.0"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

// OC-37/OC-44: Single-version build (no stonecutter aggregation). The external
// build_all script expects a `collectJars` task on every project; stonecutter
// projects provide it per-version via Copy into root build/libs. For this
// single-version layout the jar already lives in build/libs, so this is a
// lifecycle alias that ensures the build succeeded and logs the collected jars.
tasks.register("collectJars") {
    group = "build"
    description = "Collects built jars into build/libs (single-version alias for build)"
    dependsOn("build")
    doLast {
        def libsDir = layout.buildDirectory.dir("libs").get().asFile
        if (!libsDir.isDirectory()) {
            throw new GradleException("Expected libs dir not found: ${libsDir}")
        }
        def jars = libsDir.listFiles()?.findAll { it.name.endsWith(".jar") }?.collect { it.name } ?: []
        logger.lifecycle("collectJars: ${jars.size()} jar(s) in ${libsDir}: ${jars}")
    }
}

tasks.register("cleanCollectedJars", Delete) {
    group = "build"
    description = "Cleans collected jars (single-version no-op, deletes build/libs)"
    delete(layout.buildDirectory.dir("libs"))
}
